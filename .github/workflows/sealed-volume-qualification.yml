name: Sealed volume qualification
'on':
  pull_request:
    paths:
    - .github/sealed-volume/**
    - .github/workflows/sealed-volume-qualification.yml
permissions:
  contents: read
concurrency:
  group: sealed-volume-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        path: qualification-source
    - name: Authenticate source, bounded separate pre-entry bootstrap
      id: bootstrap
      shell: bash
      run: "set -euo pipefail\n/usr/bin/sudo --non-interactive /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -I -S - \"$(/usr/bin/id -u)\" \"$(/usr/bin/id -g)\" <<'PY'\nimport hashlib,os,pathlib,signal,sys\ndef protected_source(path):\n    # Fixed route only. Never print resolved destinations, contents or exceptions.\n    allowed = ('/', '/credit-qualification', '/credit-qualification/source',\n               '/credit-qualification/source/route_cli.py')\n    for item in (path, *path.parents):\n        label = str(item)\n        if label not in allowed:\n            raise ValueError(\"fixed source route required\")\n        index = allowed.index(label)\n        print(\"guard-before item=\" + str(index), flush=True)\n        reason = \"observe\"\n        uid = mode = -1\n        try:\n            info = item.stat()\n            uid, mode = info.st_uid, info.st_mode & 0o7777\n            if item.resolve(strict=True) != item:\n                reason = \"canonical\"\n     \
        \       elif uid != 0:\n                reason = \"owner\"\n            elif mode & 0o022:\n                reason = \"write-bits\"\n            else:\n                reason = \"pass\"\n        except OSError:\n            pass\n        print(\"guard-after item=\" + str(index) + \" reason=\" + reason +\n              \" uid=\" + str(uid) + \" mode=\" + str(mode), flush=True)\n        if reason != \"pass\":\n            raise ValueError(\"protected source rejected fixed item \" + str(index))\n\n# Separate 120-second pre-entry bootstrap budget, not the shared phase budget.\nsignal.signal(signal.SIGALRM,lambda *_: (_ for _ in ()).throw(TimeoutError(\"bootstrap deadline\")))\nsignal.alarm(120)\npins={'route_cli.py': '74f7db4e15528cb6cdd1bb8780089641313a45b822d0c11301ce7913cfe36345', 'shared_budget.py': 'bcd9d0fe283e3e32a5d75764bbf7cbe1557d88f4c0d6f5e621f3033f82313d48', 'volume_entry.py': '30e2368e50c4960ca51fe0160977bf6f7e396aaed1e005ed63f7540967087189', 'volume_launch.py': '1760493efe1f4c94a8a991324ff44e38e845f38a1b8d8e2e5d1c4894b8544efb',\
        \ 'volume_invoke.py': 'c394bc5b2fa94c8eab89f92fe5c96b853b1743657bd557ed749307e64f56a4e7', 'volume_bootstrap.py': 'd751b9126ad7b9eae0bdc186200383534339e685db45a063bae63e45ce831446', 'bounded_executor.py': '388ba2f4cb4113230ec1bb9532c2a777dd7bb57453d221db441c67dbdf8e4280', 'volume_driver.py': '7ef9851f90e594c160aa1dd3e8e131e18d58931edfd7e8ceb89084c7d3a9bf2b', 'volume_lifecycle.py': '259c84edcd8f6d3ff3375d500604dc1920b9721a9ce038db04b3db61f10028f7', 'source_contract.py': '5c8b0b330df7e3ddf6438981f089f3a67a678a685ebf0cf182cf53ddcb1f7ec5', 'volume_stage.py': '924ad90eaf362eb355d481d4870155f0d3d4abad06131f9a6c86e430ad8552f2', 'volume_reconcile.py': '1409db49e85132f8ad31332c22e96cba4d430ec6f53147660929b6aaa5a6adef', 'public_evidence.py': 'ea5a63d67557554b95bed6e95dca6a50e39867ccb2d825f4ae313f8391f477a0', 'provision_executor.py': '37b64bd3ea709cce08f11ae4e8443cc8eb4c65d2cb55fda81c016362263bcc6a'}\nsource=pathlib.Path(\"qualification-source/.github/sealed-volume\")\nroot=pathlib.Path(\"/credit-qualification\"\
        )\nprint(\"bootstrap-before-root\",flush=True)\nprotected_source(pathlib.Path(\"/\"))\nroot.mkdir(mode=0o755)\n(root/\"source\").mkdir(mode=0o755)\nprotected_source(root/\"source\")\nprint(\"bootstrap-after-source\",flush=True)\nfor name,expected in pins.items():\n    path=source/name\n    if path.is_symlink() or not path.is_file(): raise ValueError(\"source route\")\n    raw=path.read_bytes()\n    if len(raw)>1048576 or hashlib.sha256(raw).hexdigest()!=expected: raise ValueError(\"source hash\")\n    fd=os.open(root/\"source\"/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o444)\n    with os.fdopen(fd,\"wb\") as stream:\n        stream.write(raw);stream.flush();os.fsync(stream.fileno())\n(root/\"evidence\").mkdir(mode=0o700)\nos.chown(root/\"evidence\",int(sys.argv[1]),int(sys.argv[2]))\nprotected_source(root/\"source\"/\"route_cli.py\")\nprint(\"bootstrap-complete\",flush=True)\nsignal.alarm(0)\nPY\n"
    - name: Foreground shared-budget native acquisition and qualification
      id: foreground
      shell: bash
      run: "set -euo pipefail\n/usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -I -S - <<'PY'\nimport hashlib,pathlib,sys\npath=pathlib.Path(\"/credit-qualification/source/route_cli.py\")\ndef protected_source(path):\n    # Fixed route only. Never print resolved destinations, contents or exceptions.\n    allowed = ('/', '/credit-qualification', '/credit-qualification/source',\n               '/credit-qualification/source/route_cli.py')\n    for item in (path, *path.parents):\n        label = str(item)\n        if label not in allowed:\n            raise ValueError(\"fixed source route required\")\n        index = allowed.index(label)\n        print(\"guard-before item=\" + str(index), flush=True)\n        reason = \"observe\"\n        uid = mode = -1\n        try:\n            info = item.stat()\n            uid, mode = info.st_uid, info.st_mode & 0o7777\n            if item.resolve(strict=True) != item:\n                reason = \"canonical\"\n            elif uid != 0:\n\
        \                reason = \"owner\"\n            elif mode & 0o022:\n                reason = \"write-bits\"\n            else:\n                reason = \"pass\"\n        except OSError:\n            pass\n        print(\"guard-after item=\" + str(index) + \" reason=\" + reason +\n              \" uid=\" + str(uid) + \" mode=\" + str(mode), flush=True)\n        if reason != \"pass\":\n            raise ValueError(\"protected source rejected fixed item \" + str(index))\nprotected_source(path)\nprint(\"route-before-foreground\",flush=True)\nraw=path.read_bytes()\nif hashlib.sha256(raw).hexdigest()!='74f7db4e15528cb6cdd1bb8780089641313a45b822d0c11301ce7913cfe36345': raise ValueError(\"route hash\")\nsys.argv=[str(path),'qualify']\nexec(compile(raw,str(path),\"exec\"),{\"__name__\":\"__main__\",\"__file__\":str(path)})\nPY\n"
    - name: reconcile
      id: reconcile
      if: always()
      shell: bash
      run: "set -euo pipefail\n/usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -I -S - <<'PY'\nimport hashlib,pathlib,sys\npath=pathlib.Path(\"/credit-qualification/source/route_cli.py\")\ndef protected_source(path):\n    # Fixed route only. Never print resolved destinations, contents or exceptions.\n    allowed = ('/', '/credit-qualification', '/credit-qualification/source',\n               '/credit-qualification/source/route_cli.py')\n    for item in (path, *path.parents):\n        label = str(item)\n        if label not in allowed:\n            raise ValueError(\"fixed source route required\")\n        index = allowed.index(label)\n        print(\"guard-before item=\" + str(index), flush=True)\n        reason = \"observe\"\n        uid = mode = -1\n        try:\n            info = item.stat()\n            uid, mode = info.st_uid, info.st_mode & 0o7777\n            if item.resolve(strict=True) != item:\n                reason = \"canonical\"\n            elif uid != 0:\n\
        \                reason = \"owner\"\n            elif mode & 0o022:\n                reason = \"write-bits\"\n            else:\n                reason = \"pass\"\n        except OSError:\n            pass\n        print(\"guard-after item=\" + str(index) + \" reason=\" + reason +\n              \" uid=\" + str(uid) + \" mode=\" + str(mode), flush=True)\n        if reason != \"pass\":\n            raise ValueError(\"protected source rejected fixed item \" + str(index))\nprotected_source(path)\nprint(\"route-before-reconcile\",flush=True)\nraw=path.read_bytes()\nif hashlib.sha256(raw).hexdigest()!='74f7db4e15528cb6cdd1bb8780089641313a45b822d0c11301ce7913cfe36345': raise ValueError(\"route hash\")\nsys.argv=[str(path),'reconcile']\nexec(compile(raw,str(path),\"exec\"),{\"__name__\":\"__main__\",\"__file__\":str(path)})\nPY\n"
    - name: bundle
      id: bundle
      if: always()
      shell: bash
      run: "set -euo pipefail\n/usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -I -S - <<'PY'\nimport hashlib,pathlib,sys\npath=pathlib.Path(\"/credit-qualification/source/route_cli.py\")\ndef protected_source(path):\n    # Fixed route only. Never print resolved destinations, contents or exceptions.\n    allowed = ('/', '/credit-qualification', '/credit-qualification/source',\n               '/credit-qualification/source/route_cli.py')\n    for item in (path, *path.parents):\n        label = str(item)\n        if label not in allowed:\n            raise ValueError(\"fixed source route required\")\n        index = allowed.index(label)\n        print(\"guard-before item=\" + str(index), flush=True)\n        reason = \"observe\"\n        uid = mode = -1\n        try:\n            info = item.stat()\n            uid, mode = info.st_uid, info.st_mode & 0o7777\n            if item.resolve(strict=True) != item:\n                reason = \"canonical\"\n            elif uid != 0:\n\
        \                reason = \"owner\"\n            elif mode & 0o022:\n                reason = \"write-bits\"\n            else:\n                reason = \"pass\"\n        except OSError:\n            pass\n        print(\"guard-after item=\" + str(index) + \" reason=\" + reason +\n              \" uid=\" + str(uid) + \" mode=\" + str(mode), flush=True)\n        if reason != \"pass\":\n            raise ValueError(\"protected source rejected fixed item \" + str(index))\nprotected_source(path)\nprint(\"route-before-bundle\",flush=True)\nraw=path.read_bytes()\nif hashlib.sha256(raw).hexdigest()!='74f7db4e15528cb6cdd1bb8780089641313a45b822d0c11301ce7913cfe36345': raise ValueError(\"route hash\")\nsys.argv=[str(path),'bundle']\nexec(compile(raw,str(path),\"exec\"),{\"__name__\":\"__main__\",\"__file__\":str(path)})\nPY\n"
    - name: Verify exact recursive synthetic bundle before upload
      id: verify
      if: always()
      shell: bash
      run: "/usr/bin/python3 -I -S - <<'PY'\nimport hashlib,json,os,pathlib,stat,re\nroot=pathlib.Path('/credit-qualification/evidence/public-evidence')\nmanifest_path=root/'SHA256.json'\nif manifest_path.is_symlink() or manifest_path.stat().st_size>33554432: raise SystemExit(1)\nmanifest=json.loads(manifest_path.read_bytes())\nif type(manifest) is not dict or len(manifest)>=4096 or 'SHA256.json' in manifest: raise SystemExit(1)\nfiles={};total=0;count=0\nfor p in root.rglob('*'):\n    info=p.lstat();count+=1\n    if count>8192: raise SystemExit(1)\n    if stat.S_ISDIR(info.st_mode): continue\n    if not stat.S_ISREG(info.st_mode) or info.st_nlink!=1 or info.st_size>33554432: raise SystemExit(1)\n    raw=p.read_bytes();total+=len(raw)\n    if total>251658240: raise SystemExit(1)\n    name=p.relative_to(root).as_posix()\n    if name!='SHA256.json': files[name]=hashlib.sha256(raw).hexdigest()\nif files!=manifest: raise SystemExit(1)\nif not {'summary.json','source-bindings.json'}<=set(files):\
        \ raise SystemExit(1)\nsummary=json.loads((root/'summary.json').read_bytes())\nif summary.get('status') not in ('PASS','HOLD'): raise SystemExit(1)\nPY\n"
    - name: Retain only verified synthetic qualification evidence
      id: upload
      if: always() && steps.verify.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sealed-volume-${{ github.run_id }}-${{ github.run_attempt }}
        path: /credit-qualification/evidence/public-evidence/
        if-no-files-found: error
        retention-days: 7
    - name: Require all outcomes, final recursive hashes and foreground PASS
      if: always()
      env:
        FOREGROUND: ${{ steps.foreground.outcome }}
        RECONCILE: ${{ steps.reconcile.outcome }}
        BUNDLE: ${{ steps.bundle.outcome }}
        VERIFY: ${{ steps.verify.outcome }}
        UPLOAD: ${{ steps.upload.outcome }}
        DIGEST: ${{ steps.upload.outputs.artifact-digest }}
      shell: bash
      run: "/usr/bin/python3 -I -S - <<'PY'\nimport hashlib,json,os,pathlib,stat,re\nroot=pathlib.Path('/credit-qualification/evidence/public-evidence')\nmanifest_path=root/'SHA256.json'\nif manifest_path.is_symlink() or manifest_path.stat().st_size>33554432: raise SystemExit(1)\nmanifest=json.loads(manifest_path.read_bytes())\nif type(manifest) is not dict or len(manifest)>=4096 or 'SHA256.json' in manifest: raise SystemExit(1)\nfiles={};total=0;count=0\nfor p in root.rglob('*'):\n    info=p.lstat();count+=1\n    if count>8192: raise SystemExit(1)\n    if stat.S_ISDIR(info.st_mode): continue\n    if not stat.S_ISREG(info.st_mode) or info.st_nlink!=1 or info.st_size>33554432: raise SystemExit(1)\n    raw=p.read_bytes();total+=len(raw)\n    if total>251658240: raise SystemExit(1)\n    name=p.relative_to(root).as_posix()\n    if name!='SHA256.json': files[name]=hashlib.sha256(raw).hexdigest()\nif files!=manifest: raise SystemExit(1)\nif not {'summary.json','source-bindings.json'}<=set(files):\
        \ raise SystemExit(1)\nsummary=json.loads((root/'summary.json').read_bytes())\nif summary.get('status') not in ('PASS','HOLD'): raise SystemExit(1)\nif not {'summary.json','image.json','tools.json','source-bindings.json','launch-closeout.json','foreground.json','reconciliation.json','volume-observation.json'}<=set(files): raise SystemExit(1)\nif any(os.environ[k]!='success' for k in ('FOREGROUND','RECONCILE','BUNDLE','VERIFY','UPLOAD')): raise SystemExit(1)\nif not re.fullmatch(r'[0-9a-f]{64}',os.environ['DIGEST']): raise SystemExit(1)\nif json.loads((root/'summary.json').read_bytes())['status']!='PASS': raise SystemExit(1)\nprint('artifact_sha256='+os.environ['DIGEST'])\nPY\n"
